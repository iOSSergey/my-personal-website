name: CI/CD Deployment

on:
  push:
    branches:
      - main

env:
  DEPLOY_DOMAIN: sergey.devops-team.pl
  SITE_NAME: my-personal-website
  WEB_ROOT: /var/www/my-personal-website
  ACME_ROOT: /var/www/certbot

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare Debian 12 server
        env:
          USERNAME: ${{ secrets.USERNAME }}
          SERVER: ${{ secrets.SERVER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USERNAME@$SERVER << 'EOF'
          set -e

          SITE_NAME="${{ env.SITE_NAME }}"
          WEB_ROOT="${{ env.WEB_ROOT }}"
          ACME_ROOT="${{ env.ACME_ROOT }}"

          if [ -r /etc/os-release ]; then
            . /etc/os-release
          fi

          if [ "${ID:-}" != "debian" ] || [ "${VERSION_ID:-}" != "12" ]; then
            echo "This deployment expects Debian 12. Found: ${PRETTY_NAME:-unknown}"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y ca-certificates rsync nginx certbot

          sudo install -d -m 0755 "$WEB_ROOT" "$ACME_ROOT"
          sudo systemctl enable nginx

          if command -v docker >/dev/null 2>&1; then
            if [ -d "$HOME/dev/$SITE_NAME" ]; then
              cd "$HOME/dev/$SITE_NAME"
              sudo docker compose down || true
            fi

            sudo docker stop nginx cms certbot 2>/dev/null || true
          fi
          EOF

      - name: Deploy static files
        env:
          USERNAME: ${{ secrets.USERNAME }}
          SERVER: ${{ secrets.SERVER }}
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            --rsync-path="sudo rsync" \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./html/ $USERNAME@$SERVER:${{ env.WEB_ROOT }}/

      - name: Install Nginx bootstrap config
        env:
          USERNAME: ${{ secrets.USERNAME }}
          SERVER: ${{ secrets.SERVER }}
        run: |
          scp -o StrictHostKeyChecking=no config/nginx/native-http.conf $USERNAME@$SERVER:/tmp/${{ env.SITE_NAME }}.conf

          ssh -o StrictHostKeyChecking=no $USERNAME@$SERVER << 'EOF'
          set -e

          SITE_NAME="${{ env.SITE_NAME }}"

          sudo install -m 0644 "/tmp/$SITE_NAME.conf" "/etc/nginx/sites-available/$SITE_NAME"
          sudo ln -sfn "/etc/nginx/sites-available/$SITE_NAME" "/etc/nginx/sites-enabled/$SITE_NAME"
          sudo rm -f /etc/nginx/sites-enabled/default

          sudo nginx -t
          sudo systemctl restart nginx
          EOF

      - name: Ensure Let's Encrypt certificate
        env:
          USERNAME: ${{ secrets.USERNAME }}
          SERVER: ${{ secrets.SERVER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USERNAME@$SERVER << 'EOF'
          set -e

          DEPLOY_DOMAIN="${{ env.DEPLOY_DOMAIN }}"
          ACME_ROOT="${{ env.ACME_ROOT }}"

          if [ ! -f "/etc/letsencrypt/live/$DEPLOY_DOMAIN/fullchain.pem" ] || [ ! -f "/etc/letsencrypt/live/$DEPLOY_DOMAIN/privkey.pem" ]; then
            sudo certbot certonly \
              --webroot \
              -w "$ACME_ROOT" \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              -d "$DEPLOY_DOMAIN"
          fi

          sudo install -d -m 0755 /etc/letsencrypt/renewal-hooks/deploy
          printf '%s\n' \
            '#!/bin/sh' \
            'systemctl reload nginx' | sudo tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx >/dev/null
          sudo chmod 0755 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
          EOF

      - name: Install Nginx HTTPS config
        env:
          USERNAME: ${{ secrets.USERNAME }}
          SERVER: ${{ secrets.SERVER }}
        run: |
          scp -o StrictHostKeyChecking=no config/nginx/native-site.conf $USERNAME@$SERVER:/tmp/${{ env.SITE_NAME }}.conf

          ssh -o StrictHostKeyChecking=no $USERNAME@$SERVER << 'EOF'
          set -e

          SITE_NAME="${{ env.SITE_NAME }}"

          sudo install -m 0644 "/tmp/$SITE_NAME.conf" "/etc/nginx/sites-available/$SITE_NAME"
          sudo nginx -t
          sudo systemctl reload nginx
          EOF
