server {
    listen 80;
    listen [::]:80;
    server_name sergey.devops-team.pl;

    root /var/www/my-personal-website;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 301 /about-me;
    }

    location / {
        try_files
            /pages$uri.html
            /pages$uri/index.html
            =404;
    }

    location /assets/ {
        alias /var/www/my-personal-website/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /files/ {
        alias /var/www/my-personal-website/files/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
